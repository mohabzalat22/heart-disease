services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/heart-disease?schema=public}

    container_name: cardioai-app
    restart: unless-stopped

    env_file:
      - ${ENV_FILE:-.env}

    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/heart-disease?schema=public}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.5:cloud}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - '3000:3000'

    volumes:
      - app_logs:/app/logs
      - .:/app:delegated
      - /app/node_modules

    command: npm run dev

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - dist/

        - action: rebuild
          path: package.json

  studio:
    image: node:20-alpine
    container_name: cardioai-studio

    working_dir: /app
    volumes:
      - .:/app

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/heart-disease?schema=public}
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - '5555:5555'

    command: sh -c "npx prisma generate && npx prisma studio --port 5555 --browser none"

    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    container_name: cardioai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: heart-disease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d heart-disease']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  app_logs:
